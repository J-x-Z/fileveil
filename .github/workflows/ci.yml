name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Packaging unit tests
        run: python -m unittest discover -s tests -p test_packaging.py -v
      - name: Restore platform Cargo cache
        uses: actions/cache/restore@v4
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}-
            ${{ runner.os }}-${{ runner.arch }}-cargo-
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev libgl1-mesa-dri qpdf poppler-utils xvfb xauth xdotool
      - name: macOS PDF backends
        if: runner.os == 'macOS'
        run: brew install qpdf poppler
      - name: Windows PDF backend
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force work/backends | Out-Null
          $base = 'https://github.com/qpdf/qpdf/releases/download/v12.4.2'
          $asset = 'qpdf-12.4.2-msvc64.zip'
          Invoke-WebRequest "$base/$asset" -OutFile "work/backends/$asset"
          Invoke-WebRequest "$base/qpdf-12.4.2.sha256" -OutFile work/backends/checksums.txt
          $actual = (Get-FileHash "work/backends/$asset" -Algorithm SHA256).Hash.ToLower()
          $entry = Get-Content work/backends/checksums.txt | Where-Object { $_ -match [regex]::Escape($asset) + '$' }
          if (-not $entry -or -not $entry.StartsWith($actual)) { throw 'qpdf checksum mismatch' }
          Expand-Archive "work/backends/$asset" work/backends/qpdf
          $binary = Get-ChildItem work/backends/qpdf -Recurse -Filter qpdf.exe | Select-Object -First 1
          if (-not $binary) { throw 'qpdf executable missing' }
          "FILEVEIL_QPDF=$($binary.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Probe Windows PDF backend private paths
        if: runner.os == 'Windows'
        shell: python {0}
        run: |
          import hashlib
          import json
          import os
          import pathlib
          import subprocess
          import tempfile
          reports = []
          with tempfile.TemporaryDirectory(prefix='.fileveil-backend-job-') as directory:
              snapshot = pathlib.Path(directory) / 'snapshot.pdf'
              snapshot.write_bytes(pathlib.Path('crates/fileveil-engine/tests/fixtures/provenance/signed.pdf').read_bytes())
              for style in ['dos', 'verbatim', 'relative-cwd']:
                  program = str(pathlib.Path(os.environ['FILEVEIL_QPDF']).resolve())
                  path = str(snapshot.resolve())
                  working_directory = None
                  if style in ['verbatim', 'relative-cwd']:
                      program = '\\\\?\\' + program
                  if style == 'verbatim':
                      path = '\\\\?\\' + path
                  if style == 'relative-cwd':
                      working_directory = '\\\\?\\' + str(snapshot.parent.resolve())
                      path = snapshot.name
                  arguments = [program, '--suppress-recovery', '--json-output=2', '--json-key=qpdf', '--json-key=pages', '--json-stream-data=inline', '--decode-level=none', path]
                  result = subprocess.run(arguments, cwd=working_directory, capture_output=True, timeout=30)
                  reports.append({'style':style, 'exit_code':result.returncode, 'stdout_bytes':len(result.stdout), 'stdout_sha256':hashlib.sha256(result.stdout).hexdigest(), 'stderr':result.stderr.decode('utf-8', errors='replace')[:2048]})
          pathlib.Path('work/pdf-path-probe.json').write_text(json.dumps(reports, indent=2), encoding='utf-8')
          print(json.dumps(reports))
          assert all(report['exit_code'] == 0 for report in reports if report['style'] in ['dos', 'relative-cwd']), reports
      - name: Save Windows backend path evidence
        uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: backend-path-evidence-windows
          path: work/pdf-path-probe.json
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        shell: python {0}
        run: |
          import pathlib
          import subprocess
          import sys
          result = subprocess.run(['cargo', 'test', '--locked', '--workspace'], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, encoding='utf-8', errors='replace')
          pathlib.Path('work').mkdir(exist_ok=True)
          pathlib.Path('work/ci-tests.log').write_text(result.stdout, encoding='utf-8')
          print(result.stdout, end='', flush=True)
          sys.exit(result.returncode)
      - name: Save native test evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence-${{ matrix.os }}
          path: |
            work/ci-tests.log
            work/pdf-path-probe.json
      - name: Generate synthetic samples
        run: cargo run --locked -p fixture-generator -- work/ci-fixtures
      - name: Pinned historical Heritage compatibility
        shell: python {0}
        run: |
          import pathlib
          import subprocess
          import sys
          subprocess.run([sys.executable, 'tools/fetch-heritage-reference-samples.py'], check=True, timeout=120)
          result = subprocess.run(['cargo', 'test', '--locked', '-p', 'fileveil-engine', '--test', 'heritage_legacy', 'real_upstream_samples_match_independent_openssl_and_original_bytes', '--', '--ignored', '--exact'], capture_output=True, text=True, encoding='utf-8', errors='replace', timeout=120)
          pathlib.Path('work/heritage-legacy-reference.log').write_text(result.stdout + result.stderr, encoding='utf-8')
          print(result.stdout + result.stderr)
          sys.exit(result.returncode)
      - name: Offline C2PA creation interoperability
        shell: python {0}
        run: |
          import json
          import os
          import pathlib
          import shutil
          import subprocess
          candidates = [pathlib.Path('/opt/homebrew/opt/openssl@3/bin/openssl'), pathlib.Path('/usr/local/opt/openssl@3/bin/openssl'), pathlib.Path('C:/Program Files/Git/usr/bin/openssl.exe')]
          program = next((str(path) for path in candidates if path.is_file()), shutil.which('openssl'))
          if program is None:
              pathlib.Path('work/heritage-c2pa-creation.log').write_text(json.dumps({'result':'not_assessed','reason':'OpenSSL interoperability prerequisite unavailable'}))
          else:
              environment = dict(os.environ, PATH=str(pathlib.Path(program).parent) + os.pathsep + os.environ['PATH'])
              result = subprocess.run(['cargo', 'test', '--locked', '-p', 'fileveil-engine', '--lib', 'heritage::c2pa_mark::tests::creates_c2pa_with_local_certificate_and_rechecks_pixels_signature_and_binding', '--', '--ignored', '--exact'], env=environment, capture_output=True, text=True, encoding='utf-8', errors='replace', timeout=180)
              pathlib.Path('work/heritage-c2pa-creation.log').write_text(result.stdout + result.stderr, encoding='utf-8')
              print(result.stdout + result.stderr)
              if result.returncode:
                  raise SystemExit(result.returncode)
      - name: Independent macOS native media decode
        if: runner.os == 'macOS'
        run: |
          sips -s format png tests/fixtures/heic_exif_gps.heic --out work/heic-decoded.png > work/native-media-interop.log
          sips -s format png tests/fixtures/avif_exif_gps.avif --out work/avif-decoded.png >> work/native-media-interop.log
          swift crates/fileveil-formats/tests/support/decode_native_video.swift tests/fixtures/mp4_container_times.mp4 tests/fixtures/mov_model_metadata.mov >> work/native-media-interop.log
          sips -s format png crates/fileveil-engine/tests/fixtures/provenance/signed.heic --out work/signed-heic-decoded.png >> work/native-media-interop.log
          sips -s format png crates/fileveil-engine/tests/fixtures/provenance/signed.avif --out work/signed-avif-decoded.png >> work/native-media-interop.log
          swift crates/fileveil-formats/tests/support/decode_native_video.swift crates/fileveil-engine/tests/fixtures/provenance/signed.mp4 crates/fileveil-engine/tests/fixtures/provenance/signed.mov >> work/native-media-interop.log
          cargo test --locked -p fileveil-engine --test media native_decoders -- --ignored >> work/native-media-interop.log 2>&1
      - name: CLI capabilities
        run: cargo run --locked -p fileveil-cli -- capabilities --json
      - name: Scan synthetic JPEG
        run: cargo run --locked -p fileveil-cli -- scan work/ci-fixtures/jpeg_exif_gps_author.jpg --json
      - name: Build CLI
        run: cargo build --locked -p fileveil-cli
      - name: Validate report schemas and legacy envelopes
        run: |
          python -m pip install "jsonschema>=4,<5"
          python tools/check-report-schemas.py
      - name: Verify synthetic copies
        shell: python {0}
        run: |
          import json
          import os
          import pathlib
          import subprocess
          executable = pathlib.Path("target/debug/fileveil" + (".exe" if os.name == "nt" else ""))
          root = pathlib.Path("work/ci-fixtures")
          fixtures = [
              "jpeg_exif_gps_author.jpg",
              "png_itxt_exif_icc.png",
              "docx_author_comments_rels.docx",
              "xlsx_author_custom_formula.xlsx",
              "pptx_author_media.pptx",
          ]
          for name in fixtures:
              original = root / name
              output = original.with_name(original.stem + ".clean" + original.suffix)
              for arguments in [
                  ["sanitize", str(original), "--output", str(output), "--json"],
                  ["verify", str(original), str(output), "--json"],
              ]:
                  process = subprocess.run([str(executable), *arguments], capture_output=True, text=True)
                  assert process.returncode in (0, 4), (name, process.stdout, process.stderr)
                  report = json.loads(process.stdout)
                  assert report["result"] in ("verified_within_scope", "partially_verified"), report
                  assert report["integrity"]["original_unchanged"] is True, report
                  assert report["integrity"]["content_equal"] is True, report
                  if original.suffix in (".jpg", ".png"):
                      assert report["integrity"]["pixel_equal"] is True, report
                  print(name, arguments[0], report["result"])
      - name: Build desktop release
        run: cargo build --locked --release -p fileveil-gui -p fileveil-cli
      - name: Windows CI software OpenGL renderer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $asset = 'mesa3d-26.2.6-release-mingw.7z'
          Invoke-WebRequest "https://github.com/pal1000/mesa-dist-win/releases/download/26.2.6/$asset" -OutFile "work/$asset"
          $actual = (Get-FileHash "work/$asset" -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne 'da0f71d9181b672c1918f3c342f11118c687f6059a46b16502845160733cc388') { throw 'Mesa checksum mismatch' }
          7z x "work/$asset" '-owork/mesa' -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Mesa extraction failed' }
          $driver = Get-ChildItem work/mesa -Recurse -Filter opengl32.dll | Where-Object { $_.FullName -match '[\\/]x64[\\/]' } | Select-Object -First 1
          if (-not $driver) { throw 'Mesa x64 driver missing' }
          Get-ChildItem $driver.DirectoryName -Filter '*.dll' | Copy-Item -Destination target/release
          'GALLIUM_DRIVER=llvmpipe' | Out-File -FilePath $env:GITHUB_ENV -Append
          'LIBGL_ALWAYS_SOFTWARE=1' | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Native Linux GUI framebuffer
        if: runner.os == 'Linux'
        run: timeout 90s xvfb-run -a target/release/fileveil-gui --smoke-test-report work/native-gui.json
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - name: Native macOS GUI framebuffer
        if: runner.os == 'macOS'
        shell: python {0}
        run: |
          import subprocess
          subprocess.run(['target/release/fileveil-gui', '--smoke-test-report', 'work/native-gui.json'], check=True, timeout=90)
      - name: Native Windows GUI framebuffer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process target/release/fileveil-gui.exe -ArgumentList '--smoke-test-report', 'work/native-gui.json' -PassThru -RedirectStandardOutput work/native-gui.stdout.log -RedirectStandardError work/native-gui.stderr.log
          if (-not $process.WaitForExit(60000)) { Stop-Process -Id $process.Id; throw 'GUI timeout' }
          if ($process.ExitCode -ne 0) { throw "GUI exit $($process.ExitCode)" }
          if (-not (Test-Path work/native-gui.json)) { throw 'GUI framebuffer report missing' }
          $evidence = Get-Content work/native-gui.json -Raw | ConvertFrom-Json
          $evidence | Add-Member -NotePropertyName ci_renderer_requested -NotePropertyValue 'Mesa 26.2.6 MinGW x64 llvmpipe software OpenGL'
          $evidence | ConvertTo-Json -Depth 20 | Set-Content work/native-gui.json
      - name: Native Linux pointer interaction
        if: runner.os == 'Linux'
        run: timeout 120s xvfb-run -a python tools/native-interaction.py --executable target/release/fileveil-gui --report work/native-interaction.json
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - name: Native Windows pointer interaction
        if: runner.os == 'Windows'
        run: python tools/native-interaction.py --executable target/release/fileveil-gui.exe --report work/native-interaction.json
      - name: Native Linux Heritage pointer interaction
        if: runner.os == 'Linux'
        run: timeout 120s xvfb-run -a python tools/native-interaction.py --scenario heritage --executable target/release/fileveil-gui --report work/native-heritage.json
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - name: Native Windows Heritage pointer interaction
        if: runner.os == 'Windows'
        run: python tools/native-interaction.py --scenario heritage --executable target/release/fileveil-gui.exe --report work/native-heritage.json
      - name: Validate native framebuffer evidence
        shell: python {0}
        run: |
          import json
          import pathlib
          import struct
          root = pathlib.Path('work/native-gui')
          report = json.loads(root.with_suffix('.json').read_text(encoding='utf-8-sig'))
          pixels = root.with_suffix('.png').read_bytes()
          assert report['native_window_rendered'] is True, report
          assert report['frames_before_capture'] >= 3, report
          assert pixels.startswith(b'\x89PNG\r\n\x1a\n') and len(pixels) > 1024
          width, height = struct.unpack('>II', pixels[16:24])
          assert (width, height) == (report['width'], report['height']), report
          assert width >= 320 and height >= 240, report
          print(json.dumps(report))
      - name: Package desktop application
        run: python tools/package-desktop.py --skip-build
      - name: Exercise packaged CLI and report schemas
        shell: python {0}
        run: |
          import hashlib
          import json
          import os
          import pathlib
          import subprocess
          import sys
          import tomllib
          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['workspace']['package']['version']
          if sys.platform == 'darwin':
              executable = pathlib.Path('dist/FileVeil.app/Contents/MacOS/fileveil')
          else:
              platform = 'windows' if os.name == 'nt' else 'linux'
              executable = pathlib.Path(f'dist/FileVeil-{version}-{platform}') / ('fileveil.exe' if os.name == 'nt' else 'fileveil')
          environment = dict(os.environ)
          environment.pop('FILEVEIL_QPDF', None)
          capabilities = json.loads(subprocess.check_output([str(executable), 'capabilities', '--json'], env=environment, text=True))
          assert capabilities['pdf']['available'] is True, capabilities['pdf']
          subprocess.run([sys.executable, 'tools/check-report-schemas.py', '--executable', str(executable)], env=environment, check=True, timeout=120)
          original = pathlib.Path('work/ci-fixtures/jpeg_exif_gps_author.jpg')
          original_hash = hashlib.sha256(original.read_bytes()).hexdigest()
          output = pathlib.Path('work/packaged-jpeg.clean.jpg')
          for arguments in [['sanitize', str(original), '--output', str(output), '--json'], ['verify', str(original), str(output), '--json']]:
              process = subprocess.run([str(executable), *arguments], env=environment, capture_output=True, text=True, timeout=120)
              assert process.returncode in (0, 4), (process.stdout, process.stderr)
              report = json.loads(process.stdout)
              assert report['integrity']['content_equal'] is True, report
              assert report['integrity']['original_unchanged'] is True, report
          assert hashlib.sha256(original.read_bytes()).hexdigest() == original_hash
          pathlib.Path('work/packaged-cli.json').write_text(json.dumps({'version':version, 'pdf_backend_available':True, 'schema_reports_validated':True, 'jpeg_sanitize_verify':True, 'original_unchanged':True}) + '\n')
      - name: Inspect macOS package signatures and Gatekeeper
        if: runner.os == 'macOS'
        shell: python {0}
        run: |
          import json
          import pathlib
          import subprocess
          bundle = 'dist/FileVeil.app'
          subprocess.run(['codesign', '--verify', '--strict', '--verbose=2', bundle], check=True, timeout=60)
          details = subprocess.run(['codesign', '--display', '--verbose=4', bundle], capture_output=True, text=True, timeout=30)
          evidence = {'platform':'macos', 'codesign_verified':True, 'signing_mode':'ad_hoc', 'developer_id_notarization':'not_configured', 'signature_details':details.stderr}
          for name, arguments in [('gatekeeper_policy',['spctl','--status']), ('gatekeeper_assessment',['spctl','--assess','--type','execute','--verbose=2',bundle])]:
              try:
                  result = subprocess.run(arguments, capture_output=True, text=True, timeout=60)
                  evidence[name] = {'exit_code':result.returncode, 'stdout':result.stdout, 'stderr':result.stderr}
              except subprocess.TimeoutExpired:
                  evidence[name] = {'status':'not_completed', 'reason':'assessment_timeout'}
          pathlib.Path('work/native-signature.json').write_text(json.dumps(evidence, indent=2) + '\n')
      - name: Inspect Windows Authenticode status
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = (Get-ChildItem dist -Recurse -Filter fileveil-package.json | Select-Object -First 1).Directory
          $evidence = @('fileveil-gui.exe', 'fileveil.exe') | ForEach-Object {
            $signature = Get-AuthenticodeSignature -FilePath (Join-Path $package.FullName $_)
            [PSCustomObject]@{ binary = $_; status = $signature.Status.ToString() }
          }
          $evidence | ConvertTo-Json -Depth 10 | Set-Content work/native-signature.json
      - uses: actions/upload-artifact@v4
        with:
          name: FileVeil-${{ matrix.os }}
          path: dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-evidence-${{ matrix.os }}
          path: |
            work/native-gui.*
            work/native-interaction.*
            work/native-heritage.*
            work/native-media-interop.log
            work/heritage-legacy-reference.log
            work/heritage-c2pa-creation.log
            work/packaged-cli.json
            work/native-signature.json
      - name: Save platform Cargo cache
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
