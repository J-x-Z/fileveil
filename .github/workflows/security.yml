name: Dependency security
on:
  workflow_dispatch:
  push:
    paths:
      - Cargo.lock
      - '**/Cargo.toml'
      - .github/deny.toml
      - .github/workflows/security.yml
  schedule:
    - cron: '17 5 * * 1'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install audit tools
        run: cargo install --locked cargo-audit cargo-deny
      - name: Vulnerability audit
        # c2pa_raw_crypto still pins rsa 0.9. FileVeil limits RSA to public-key validation.
        # Private signing supports Ed25519 and ES256. Private RSA operations remain unavailable.
        # Remove this scoped exception when upstream adopts rsa 0.10 or before adding private RSA use.
        run: cargo audit --file Cargo.lock --ignore RUSTSEC-2023-0071
      - name: License check
        run: cargo deny --config .github/deny.toml check licenses
