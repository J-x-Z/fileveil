[package]
name = "fileveil-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
[[bin]]
name = "fileveil-gui"
path = "src/main.rs"
[dependencies]
fileveil-core.workspace = true
fileveil-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "wayland", "accesskit", "clipboard"] }
rfd = "0.18"
image.workspace = true
[target.'cfg(unix)'.dependencies]
libc = "0.2"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
[dev-dependencies]
accesskit_consumer = "=0.39.2"
