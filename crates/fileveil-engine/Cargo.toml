[package]
name = "fileveil-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
[dependencies]
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "fast", "zeroize"] }
getrandom = "=0.2.17"
zeroize = "=1.9.1"
sha2.workspace = true
hmac = "=0.13.0"
time = "=0.3.55"
sha2_v11 = { package = "sha2", version = "=0.11.1" }
des = "0.9.0"
base64 = "0.23.1"
crc32fast.workspace = true
zip.workspace = true
fileveil-core.workspace = true
fileveil-formats.workspace = true
image.workspace = true
tempfile.workspace = true
serde_json.workspace = true
serde.workspace = true
c2pa = { version = "=0.91.11", default-features = false, features = ["rust_native_crypto", "file_io", "pdf", "unstable_plain_text", "unstable_structured_text"] }
x509-parser = "0.18.1"
unicode-normalization = "0.1.26"
[target.'cfg(unix)'.dependencies]
xattr = "1.6"
libc = "0.2"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Security_Authorization"] }

# FVPROV1 1194  FVPROV1-END
