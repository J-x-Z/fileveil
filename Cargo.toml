[workspace]
members = ["crates/*", "tools/fixture-generator"]
resolver = "2"

[workspace.package]
version = "0.5.0-alpha.4"
edition = "2024"
rust-version = "1.96"
publish = false
license = "MPL-2.0"

[workspace.dependencies]
fileveil-core = { path = "crates/fileveil-core" }
fileveil-formats = { path = "crates/fileveil-formats" }
fileveil-engine = { path = "crates/fileveil-engine" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
clap = { version = "4.6", features = ["derive"] }
sha2 = "0.10"
crc32fast = "1.5"
quick-xml = "0.42"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
tempfile = "3.27"
flate2 = "1.1"

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
strip = true

# FVPROV1 839  FVPROV1-END
